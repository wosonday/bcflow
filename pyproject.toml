[project]
name = "bcflow"
version = "0.1.0"
description = "Config-driven bias-correction pipeline built on xsdba"
readme = "README.md"
authors = [{ name = "wosonday", email = "thanhsonmttn@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "xsdba>=0.7.0",
    "xarray>=2026.1.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "netCDF4>=1.7",
    "zarr>=3.0",
    "h5netcdf>=1.3",
    "scipy>=1.11",
    "numpy>=2.5.4",
    "tqdm>=4.67",
    "dask[array]>=2026.8.0",
    "psutil>=7.0",
]

[project.scripts]
bcflow = "bcflow.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "standard"
# Same as requires-python; ruff formats `except A, B:` (PEP 758, Python 3.14 only).
pythonVersion = "3.14"
extraPaths = ["scripts"]
reportReturnType = "none"

[tool.pytest.ini_options]
filterwarnings = [
    # Raised inside xsdba (not our code); remove once xsdba updates.
    "ignore:keys will default to True in jsonpickle:DeprecationWarning",
    "ignore:DatetimeIndex.dayofyear is deprecated:Warning",
]
