# Multivariate station example, reusing example_toy.yaml's generated data.
# Generate first: uv run python scripts/make_toy_data.py
# Validate: uv run bcflow validate configs/example_multivariate_stations.yaml
# Relative paths are resolved from configs/.
stations:
  metadata: ../data/toy/weather_stations.csv
  data_dir: ../data/toy/weather
  file_pattern: "{id}.csv"

variables: [precip, tmax]
model:
  hist: ../data/toy/model_hist_{var}.nc
  sim: ../data/toy/model_sim_{var}.nc
  var_map: {precip: pr, tmax: tasmax}

periods:
  calibration: ["2000", "2012"]
  validation: ["2013", "2020"]

targets:
  - name: precipitation_temperature
    variables: [precip, tmax]
    method: principal_components
    group: season

output:
  path: ../outputs
  formats: [netcdf, csv]
