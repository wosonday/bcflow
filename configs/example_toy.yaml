# Example config -- matches the data written by scripts/make_toy_data.py to data/toy/.
# Relative paths are resolved from this file's folder (configs/), hence ../data/toy/.
# Run:  uv run python scripts/make_toy_data.py    (generate the data first)
#       uv run bcflow run configs/example_toy.yaml

# Station observations, in the swat-preprocessing layout.
stations:
  metadata: ../data/toy/weather_stations.csv   # id,name,lat,lon,elev
  data_dir: ../data/toy/weather                # one CSV per station: date,precip,tmax,...
  file_pattern: "{id}.csv"                     # or "{name}.csv"

# Variables to correct (swatprep names); add tmin, wind, solar, humidity if available.
variables: [precip, tmax]

# Climate model. {var} is replaced by the name in var_map (one file per variable);
# a path without {var} is a single file holding every variable.
model:
  hist: ../data/toy/model_hist_{var}.nc
  sim: ../data/toy/model_sim_{var}.nc
  var_map: { precip: pr, tmax: tasmax, tmin: tasmin }
  lat_name: auto
  lon_name: auto
  time_name: auto
  search_radius: 1          # grid cells searched when the nearest cell is empty (0-5)

periods:
  calibration: ["2000", "2012"]   # years used to train the correction
  validation: ["2013", "2020"]    # held-out years for the before/after check

# Optional: override the per-variable defaults (see src/bcflow/variables.py).
# Defaults: quantile_delta_mapping, group: month; precip also adapt_freq at 1 mm/d.
correction:
  tmax:
    group: dayofyear      # dayofyear | month | none
    window: 15            # days pooled around each day of year (dayofyear only)

output:
  path: ../outputs        # relative to this file -> <project>/outputs (git-ignored)
  formats: [netcdf, csv]
