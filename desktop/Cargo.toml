[package]
name = "bcflow-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:futures-channel"]

[dependencies]
futures-channel = { version = "0.3", optional = true }
gpui = { version = "=0.2.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
